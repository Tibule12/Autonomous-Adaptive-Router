<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAR Network Stress Tester</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            border: 2px solid #00ff41;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        input {
            background: #333;
            border: 1px solid #00ff41;
            color: white;
            padding: 10px;
            width: 80%;
            margin: 10px 0;
            font-family: inherit;
        }
        button {
            background: #00ff41;
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover {
            background: #00cc33;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .stats {
            margin-top: 20px;
            font-size: 1.5rem;
        }
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Traffic Generator ⚡</h1>
        <p>Use this on Laptop B to stress test Laptop A</p>
        
        <label>Target IP Address (Laptop A):</label>
        <input type="text" id="ipInput" placeholder="e.g. 192.168.1.5" value="localhost">
        
        <label>Port:</label>
        <input type="number" id="portInput" value="8080">

        <label>Intensity (Requests/sec):</label>
        <input type="range" id="intensity" min="1" max="200" value="50" oninput="updateLabel()">
        <span id="intVal">50</span> req/s

        <br>
        <button id="btn" onclick="toggleAttack()">START ATTACK</button>

        <div class="stats">
            Sent: <span id="counter">0</span> packets
            <div id="status" style="font-size: 0.8rem; margin-top: 10px; color: #888;">Standby</div>
        </div>
    </div>

    <script>
        let running = false;
        let count = 0;
        let intervalIds = [];

        function updateLabel() {
            document.getElementById('intVal').innerText = document.getElementById('intensity').value;
        }

        function toggleAttack() {
            const btn = document.getElementById('btn');
            const ip = document.getElementById('ipInput').value;
            const port = document.getElementById('portInput').value;
            const url = `http://${ip}:${port}/api/stress`;

            if (running) {
                // STOP
                running = false;
                btn.innerText = "START ATTACK";
                btn.style.backgroundColor = "#00ff41";
                document.getElementById('status').innerText = "Stopped";
                document.getElementById('status').classList.remove('blink');
                intervalIds.forEach(clearInterval);
                intervalIds = [];
            } else {
                // START
                running = true;
                btn.innerText = "STOP ATTACK";
                btn.style.backgroundColor = "#ff4141";
                document.getElementById('status').innerText = `Attacking ${ip}...`;
                document.getElementById('status').classList.add('blink');
                
                const rps = parseInt(document.getElementById('intensity').value);
                const interval = 1000 / rps;

                // Create multiple intervals if needed for high speed
                const id = setInterval(() => {
                    if(!running) return;
                    fetch(url, { mode: 'no-cors' }).catch(e => {}); // Fire and forget
                    count++;
                    document.getElementById('counter').innerText = count;
                }, interval);
                intervalIds.push(id);
            }
        }
    </script>
</body>
</html>
